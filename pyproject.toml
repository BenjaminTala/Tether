[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibagent"
version = "0.1.0"
description = "Deterministic IBKR portfolio engine with a schema-bound Claude Code decision layer"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6",
    "ib_async>=1.0",
    "tzdata>=2024.1",
    "keyring>=25",
    "feedparser>=6",
]

[project.optional-dependencies]
windows = ["winotify>=1.1"]
dev = ["pytest>=8", "pytest-cov"]

[project.scripts]
ibagent = "ibagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
